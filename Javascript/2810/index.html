<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <!-- <link rel="stylesheet" href="style.css"> -->
      <link rel="stylesheet" href="styles_my.css">
      <title>Document</title>
</head>
<body>
      <div class="container mt-3">
            <form name="myForm" class="input-group mb-3 mt-3">                  
                  <input name="title" type="text" class="form-control" placeholder="Movie name" aria-label="Recipient's username" aria-describedby="button-addon2">
                  <button class="btn btn-outline-secondary" type="submit" id="button-addon2">Search</button>
                  <div class="movie-types">
                        <ul>
                              <li>
                                    <div class="form-check">
                                          <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1" checked>
                                          <label class="form-check-label" for="flexRadioDefault1">
                                            Movies
                                          </label>
                                    </div>
                              </li>
                              <li>
                                    <div class="form-check">
                                      <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2">
                                      <label class="form-check-label" for="flexRadioDefault2">
                                        Series
                                      </label>
                                    </div>
                              </li>
                              <li>
                                    <div class="form-check">
                                      <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2">
                                      <label class="form-check-label" for="flexRadioDefault2">
                                        Episode
                                      </label>
                                    </div>
                              </li>
                        </ul>
                  </div>
                </form>
            <div class="alert alert-danger" role="alert">
                  Movie not found!
            </div>
            <div class="list"></div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <script src="script.js"></script>
</body>
</html>
