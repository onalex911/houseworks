<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <!-- <link rel="stylesheet" href="style.css"> -->
      <link rel="stylesheet" href="styles_my.css">
      <title>Document</title>
</head>
<body>
      <div class="container mt-3">
            <form name="myForm" class="input-group-lg mb-3 mt-3">                  
                  <input name="title" id="searchText" type="text" class="form-control" placeholder="Movie name" aria-label="Recipient's username" aria-describedby="button-addon2">
                  <div class="movie-types mt-3">
                        <ul>
                              <li>
                                    <div class="form-check">
                                          <input class="form-check-input" type="radio" name="flexRadio" id="flexRadio_1" value="movies">
                                          <label class="form-check-label" for="flexRadio_1">
                                            Movies
                                          </label>
                                    </div>
                              </li>
                              <li>
                                    <div class="form-check">
                                      <input class="form-check-input" type="radio" name="flexRadio" id="flexRadio_2" value="series">
                                      <label class="form-check-label" for="flexRadio_2">
                                        Series
                                      </label>
                                    </div>
                              </li>
                              <li>
                                    <div class="form-check">
                                      <input class="form-check-input" type="radio" name="flexRadio" id="flexRadio_3" value="episode">
                                      <label class="form-check-label" for="flexRadio_3">
                                        Episode
                                      </label>
                                    </div>
                              </li>
                              <li>
                                    <div class="form-check">
                                      <input class="form-check-input" type="radio" name="flexRadio" id="flexRadio_4" value="" checked>
                                      <label class="form-check-label" for="flexRadio_4">
                                        All
                                    </label>
                                    </div>
                              </li>
                        </ul>
                        <button class="btn btn-outline-secondary col-12" type="submit" id="button-addon2">Search</button>
                  </div>
                </form >
            <div class="alert alert-danger" role="alert">
                  Movie not found!
            </div>
            <div class="alert alert-success" role="alert">
                  <span id="movie-type-found">Movies</span> found: <span id="movie-type-count">0</span>
            </div>
            <div class="list"></div>
            <nav aria-label="Page navigation">
                  <ul class="pagination">
                      <!-- <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                      <li class="page-item"><a class="page-link" href="#">1</a></li>
                      <li class="page-item"><a class="page-link" href="#">2</a></li>
                      <li class="page-item"><a class="page-link" href="#">3</a></li>
                      <li class="page-item"><a class="page-link" href="#">Next</a></li> -->
                  </ul>
                  <input type="number" min="3" step="2" class="form-control" id="pages-amount-input" value="3">
              </nav>
            <div class="movie-info col-12">
                  <div class="row movie-info-head"><a name="card"></a>Film info:</div>
                  <div class="row movie-info-body p-3">
                        <div class="col-3"><img id="movie-info-image" src="image_not_found.png"></div>
                        <div class="movie-info-list col-9">
                              <table>
                                    <tr>
                                          <td class="p-2">Title:</td>
                                          <td class="p-2" id="movie-info-title"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Released:</td>
                                          <td class="p-2" id="movie-info-released"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Genre:</td>
                                          <td class="p-2" id="movie-info-genre"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Country:</td>
                                          <td class="p-2" id="movie-info-country"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Director:</td>
                                          <td class="p-2" id="movie-info-director"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Writer:</td>
                                          <td class="p-2" id="movie-info-writer"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Actors:</td>
                                          <td class="p-2" id="movie-info-actors"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Awards:</td>
                                          <td class="p-2" id="movie-info-awards"></td>
                                    </tr>
                                    <tr>
                                          <td class="p-2">Full plot:</td>
                                          <td class="p-2" id="movie-info-plot"></td>
                                    </tr>
                              </table>
                        </div>
                  </div>
            </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <script src="script.js"></script>
</body>
</html>
