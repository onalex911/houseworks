<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">My First MVC project</title>
<!--    <link rel="stylesheet" href="/hw1503/css/styles.css">-->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="margin:30px">
<div class="container" >
    <h1 class="qqq">List of teachers</h1>
    <div class="error"><p th:text="${error}"></p></div>
    <div class="founs-box" th:if="${count} != null" th:text="'Found ' + ${count} + ' records'"></div>
    <table class="table">
        <thead>
        <tr>
            <th><a href="http://localhost:8081/home/sorted/id">Id</a></th>
            <th><a href="http://localhost:8081/home/sorted/name">Name</a></th>
            <th><a href="http://localhost:8081/home/sorted/surname">Surname</a></th>
            <th><a href="http://localhost:8081/home/sorted/position">Position</a></th>
            <th><a href="http://localhost:8081/home/sorted/empdate">Employment date</a></th>
            <th><a href="http://localhost:8081/home/sorted/salary">Salary</a></th>
            <th><a href="http://localhost:8081/home/sorted/premium">Premium</a></th>
            <th>Assistant</th>
            <th>Professor</th>
    <!--        <th>Assist/Prof</th>-->
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${teachers.content}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.name}"></td>
            <td th:text="${t.surname}"></td>
            <td th:text="${t.position}"></td>
            <td th:text="${t.employmentDate}"></td>
            <td th:text="'$'+${t.salary}"></td>
            <td th:text="'$'+${t.premium}"></td>
            <td class="centered" th:text="${t.isAssistant ? '✅' : ''}"></td>
            <td class="centered" th:text="${t.isProfessor ? '✅' : ''}"></td>
    <!--        <td th:text="${t.getIsProfessor()} ? 'Professor' : (${t.getIsAssistant()} ? 'Assistant' : '')"></td>-->
        </tr>
        </tbody>
    </table>
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center" th:each="i : ${#numbers.sequence(1,pages)}">
<!--            <li class="page-item"><a class="page-link" href="#">Previous</a></li>-->
            <li class="page-item" th:classappend="${i-1 == page}? 'active'"><a th:href="@{'/home/filter?'+${params}+'&page='+${(i-1)}}" th:text="${i}">1</a></li>

<!--            <li class="page-item"><a class="page-link" href="#">Next</a></li>-->
        </ul>
    </nav>
<!--    <div class="controls">-->
        <span th:text="${params}"></span>
        <span th:text="${pages}"></span>
<!--        <div class="pg-button" th:each="i : ${#numbers.sequence(1,pages)}">-->
<!--            <a th:href="@{'/home/filter?'+${params}+'&page='+${(i-1)}}" th:text="${i}"></a>-->
<!--        </div>-->
<!--    </div>-->
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
