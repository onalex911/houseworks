<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">My First MVC project</title>
<!--    <link rel="stylesheet" href="/hw1503/css/styles.css">-->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="margin:30px">
<div class="container" >
    <h1 class="qqq">List of teachers <a title="Add a teacher" th:href="@{/home/create}">➕🧑‍🏫</a></h1>


    <form method="get" action="home/filter">
        <div class="error"><p th:text="${error}"></p></div>
        <div class="top">
            <div class="found-box" th:if="${count} != null" th:text="'Found ' + ${count} + ' records'"></div>
        </div>
        <table class="table" th:if="${teachers.size()!=0}">
        <thead>
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Position</th>
            <th>Employment date</th>
            <th>Salary</th>
            <th>Premium</th>
            <th>Assistant</th>
            <th>Professor</th>
          </tr>
        </thead>
        <tbody>
    <tr th:each="t : ${teachers}" th:attr="data-id=${t.id}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.name}"></td>
            <td th:text="${t.surname}"></td>
            <td th:text="${t.position}"></td>
            <td th:text="${t.employmentDate}"></td>
<!--            <td th:text="${#dates.format(t.employmentDate, 'yyyy-MM-dd')}"></td>-->
            <td th:text="'$'+${t.salary}"></td>
            <td th:text="'$'+${t.premium}"></td>
            <td class="centered" th:text="${t.isAssistant ? '✅' : ''}"></td>
            <td class="centered" th:text="${t.isProfessor ? '✅' : ''}"></td>
<!--            <td><a class="btn-del" th:href="@{/home/delete/{id}(id=${t.id})}">🗑️</a></td>-->
            <td><a class="btn-del" th:onclick="'deleteTeacher('+${t.id}+')'">🗑️</a></td>
            </tr>
        </tbody>
    </table>
    <div class="message" th:unless="${teachers.size()!=0}">Table is empty!</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    //удаление записи по id
    async function deleteTeacher(id) {
        if(confirm("Are you sure to delete a record with id = " + id + "?")) {
            let response = await fetch(`/home/delete/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                console.log("Udalen");
                console.log(await response.text())
                document.querySelector(`tr[data-id='${id}']`).remove();
            } else {
                console.log("error")
            }
        }
    }
    //формируем запрос только из указанных фильтров
    function reload(){
        let params = '';
        let fields = document.querySelectorAll('.filter');
        console.log(fields.length);
        let i = 0;
        for(let field of fields){
            if(field.value != ''){
                if(i > 0){
                    params += "&"
                }
                params += field.name + "=" + field.value;
            }
            i++;
        }
        document.location.href = "/home/filter?"+params;
    }
</script>
</body>
</html>
